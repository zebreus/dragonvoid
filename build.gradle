plugins {
    id 'java'
    id 'application'
}

group = 'dragonvoid'
version = '0.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

// Use existing directory structure instead of Gradle's default
sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
        resources {
            srcDirs = ['.']
            include 'res/**'
        }
    }
}

repositories {
    // Local flat-dir repository for nix offline builds
    flatDir {
        dirs 'libs'
    }
    mavenCentral()
}

dependencies {
    implementation 'com.google.code.gson:gson:2.8.9'
    implementation 'org.json:json:20211205'
}

tasks.withType(JavaCompile) {
    options.encoding = 'ISO-8859-1'
}

application {
    mainClass = 'tbs.StartMainMenu'
}

jar {
    manifest {
        attributes 'Main-Class': 'tbs.StartMainMenu'
    }

    // Include runtime dependencies in the JAR
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Task to generate world data from JSON source files using the Editor.
// The JSON files (arena.json, smalltest.json, lennarts_testwelt.json) are pre-generated
// tiled exports of the corresponding TMX source files and are committed to the repository.
// In the Nix build they are regenerated from TMX via `tiled --export-map`.
tasks.register('generateWorldArena', JavaExec) {
    dependsOn 'compileJava'
    classpath = configurations.runtimeClasspath + sourceSets.main.output
    mainClass = 'tbs.editor.Editor'
    args = ["${projectDir}/res/arena.json", "${projectDir}/res/worlds/arena"]
    outputs.dir("${projectDir}/res/worlds/arena/world")
}

tasks.register('generateWorldSmalltest', JavaExec) {
    dependsOn 'compileJava'
    classpath = configurations.runtimeClasspath + sourceSets.main.output
    mainClass = 'tbs.editor.Editor'
    args = ["${projectDir}/res/smalltest.json", "${projectDir}/res/worlds/smalltest"]
    outputs.dir("${projectDir}/res/worlds/smalltest/world")
}

tasks.register('generateWorldLennartswelt', JavaExec) {
    dependsOn 'compileJava'
    classpath = configurations.runtimeClasspath + sourceSets.main.output
    mainClass = 'tbs.editor.Editor'
    args = ["${projectDir}/res/lennarts_testwelt.json", "${projectDir}/res/worlds/lennartswelt"]
    outputs.dir("${projectDir}/res/worlds/lennartswelt/world")
}

tasks.named('jar') {
    dependsOn 'generateWorldArena', 'generateWorldSmalltest', 'generateWorldLennartswelt'
    from("${projectDir}/res/worlds") { into "res/worlds" }
}

tasks.named('run') {
    dependsOn 'generateWorldArena', 'generateWorldSmalltest', 'generateWorldLennartswelt'
}
