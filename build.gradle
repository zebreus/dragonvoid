plugins {
    id 'java'
    id 'application'
}

group = 'dragonvoid'
version = '0.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

// Use existing directory structure instead of Gradle's default
sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
        resources {
            srcDirs = ['.']
            include 'res/**'
        }
    }
}

repositories {
    // Local flat-dir repository for nix offline builds
    flatDir {
        dirs 'libs'
    }
    mavenCentral()
}

dependencies {
    implementation 'com.google.code.gson:gson:2.8.9'
    implementation 'org.json:json:20211205'
}

tasks.withType(JavaCompile) {
    options.encoding = 'ISO-8859-1'
}

application {
    mainClass = 'tbs.StartMainMenu'
}

jar {
    manifest {
        attributes 'Main-Class': 'tbs.StartMainMenu'
    }

    // Include runtime dependencies in the JAR
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Export TMX source maps to JSON using the tiled CLI.
// QT_QPA_PLATFORM=offscreen is required for headless (no display) environments.
tasks.register('exportTmxArena', Exec) {
    inputs.file("${projectDir}/res/arena.tmx")
    outputs.file("${buildDir}/tiled/arena.json")
    doFirst { mkdir "${buildDir}/tiled" }
    environment 'QT_QPA_PLATFORM', 'offscreen'
    commandLine 'tiled', '--export-map', "${projectDir}/res/arena.tmx", "${buildDir}/tiled/arena.json"
}

tasks.register('exportTmxSmalltest', Exec) {
    inputs.file("${projectDir}/res/smallTest.tmx")
    outputs.file("${buildDir}/tiled/smalltest.json")
    doFirst { mkdir "${buildDir}/tiled" }
    environment 'QT_QPA_PLATFORM', 'offscreen'
    commandLine 'tiled', '--export-map', "${projectDir}/res/smallTest.tmx", "${buildDir}/tiled/smalltest.json"
}

tasks.register('exportTmxLennartswelt', Exec) {
    inputs.file("${projectDir}/res/testproject.tmx")
    outputs.file("${buildDir}/tiled/lennartswelt.json")
    doFirst { mkdir "${buildDir}/tiled" }
    environment 'QT_QPA_PLATFORM', 'offscreen'
    commandLine 'tiled', '--export-map', "${projectDir}/res/testproject.tmx", "${buildDir}/tiled/lennartswelt.json"
}

// Convert the tiled JSON exports to game world data using the Editor.
tasks.register('generateWorldArena', JavaExec) {
    dependsOn 'compileJava', 'exportTmxArena'
    classpath = configurations.runtimeClasspath + sourceSets.main.output
    mainClass = 'tbs.editor.Editor'
    args = ["${buildDir}/tiled/arena.json", "${projectDir}/res/worlds/arena"]
    outputs.dir("${projectDir}/res/worlds/arena/world")
}

tasks.register('generateWorldSmalltest', JavaExec) {
    dependsOn 'compileJava', 'exportTmxSmalltest'
    classpath = configurations.runtimeClasspath + sourceSets.main.output
    mainClass = 'tbs.editor.Editor'
    args = ["${buildDir}/tiled/smalltest.json", "${projectDir}/res/worlds/smalltest"]
    outputs.dir("${projectDir}/res/worlds/smalltest/world")
}

tasks.register('generateWorldLennartswelt', JavaExec) {
    dependsOn 'compileJava', 'exportTmxLennartswelt'
    classpath = configurations.runtimeClasspath + sourceSets.main.output
    mainClass = 'tbs.editor.Editor'
    args = ["${buildDir}/tiled/lennartswelt.json", "${projectDir}/res/worlds/lennartswelt"]
    outputs.dir("${projectDir}/res/worlds/lennartswelt/world")
}

tasks.named('jar') {
    dependsOn 'generateWorldArena', 'generateWorldSmalltest', 'generateWorldLennartswelt'
    from("${projectDir}/res/worlds") { into "res/worlds" }
}

// Exclude worlds from processResources: they are built separately and added
// explicitly by the jar task above to avoid issues with read-only Nix store
// copies and to prevent double-inclusion.
// Also exclude TMX source maps — they are only needed during the build pipeline.
processResources {
    exclude 'res/worlds/**'
    exclude 'res/*.tmx'
}

tasks.named('run') {
    dependsOn 'generateWorldArena', 'generateWorldSmalltest', 'generateWorldLennartswelt'
}
